# v2 高优先级组正文（配置中心 /gocdc/verify/config）：
# 带点库名 + target_database 非同名覆盖（表级）+ RMQ 双写 + 既有回归表(只增量)
# 2026-10-31 适配组规则形态（旧平铺形态已整体移除）。
config_version: 2
cluster: verify

source:
  addr: 127.0.0.1:13306
  user: root
  password: "123456"
  charset: utf8mb4
  flavor: mysql
  timezone: UTC
  heartbeat_interval_ms: 3000
  read_timeout_ms: 60000
  exclude_schemas: [mysql, sys, information_schema, performance_schema]
  use_gtid: true

ha:
  lease_ttl_seconds: 10
  leader_check_interval_ms: 2000
  resign_on_shutdown: true

pipeline:
  workers: 4
  worker_queue_size: 8192
  batch_size: 500
  flush_interval_ms: 200
  position_save_interval_ms: 3000

targets:
  mysql:
    enabled: true
    addr: 127.0.0.1:13307
    user: root
    password: "123456"
    charset: utf8mb4
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime_min: 30
    tx_chunk_rows: 500
    ddl_sync: true
  rocketmq:
    enabled: true
    name_servers: [127.0.0.1:8081]
    group: gocdc-hiprio
    topic_prefix: "CDC_"
    order_by: row
    send_timeout_ms: 5000

rules:
  - schema: edu.mall.admin
    ddl_policy: auto
    sinks: {mysql: true, rocketmq: true}
    tables:
      - {table: users, do_stock: true, order_by_column: id, target_database: edu.mall.merge}
  - schema: shop
    sinks: {mysql: true}
    tables:
      - {table: users, do_stock: false}
  - schema: rmqtest
    ddl_policy: auto
    sinks: {mysql: true, rocketmq: true}
    tables:
      - {table: msg, do_stock: false}
  - schema: cluster_e2e
    sinks: {mysql: true}
    tables:
      - {table: tab, do_stock: false}

observability:
  metrics_addr: ${METRICS_ADDR}
  web:
    enabled: true
    addr: ${WEB_ADDR}
    username: admin
    password: ${WEB_PASSWORD}
    auth_disabled: false
  log:
    level: info
