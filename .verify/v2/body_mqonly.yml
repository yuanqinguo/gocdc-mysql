# 纯 MQ 下游形态正文（targets.mysql.enabled=false；组65 I7 用，verify 集群
# 切换配置后位点沿用——rmqtest.msg 的 stock 标记/位点在 v2 键已就位，直接增量）
# 2026-11-04 迁移 sources[] 形态：v1 顶层单源形态已移除（load 链拒启，见
# body_main.yml 同构；单源即数组一条，id=default 与前面 case 的位点键对齐）。
config_version: 2
cluster: verify

sources:
  - id: default
    source:
      addr: 127.0.0.1:13306
      user: root
      password: "123456"
      charset: utf8mb4
      flavor: mysql
      timezone: UTC
      heartbeat_interval_ms: 3000
      read_timeout_ms: 60000
      exclude_schemas: [mysql, sys, information_schema, performance_schema]
      use_gtid: true
    targets:
      mysql:
        enabled: false
        ddl_sync: false
      rocketmq:
        enabled: true
        name_servers: [127.0.0.1:8081]
        group: gocdc-verify-mqonly
        topic_prefix: "CDC_"
        order_by: row
        send_timeout_ms: 5000
    rules:
      - schema: rmqtest
        ddl_policy: ignore
        sinks: {rocketmq: true}
        tables:
          - {table: msg, do_stock: false}

ha:
  enabled: false
  lease_ttl_seconds: 10
  leader_check_interval_ms: 2000
  resign_on_shutdown: true

pipeline:
  workers: 4
  worker_queue_size: 8192
  batch_size: 500
  flush_interval_ms: 200
  position_save_interval_ms: 3000

observability:
  metrics_addr: ${METRICS_ADDR}
  web:
    enabled: true
    addr: ${WEB_ADDR}
    username: admin
    password: ${WEB_PASSWORD}
    auth_disabled: false
  log:
    level: info
