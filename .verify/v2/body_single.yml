# v2 单节点形态正文（ha.enabled=false；verify-single 集群前缀隔离共存用）
# 2026-10-31 适配组规则形态：组 90 ④⑤ 只断言 role=single/门键/隔离，不碰数据，
# 白名单最小化（shop.users 只增量，不做全量）。
config_version: 2
cluster: verify-single

source:
  addr: 127.0.0.1:13306
  user: root
  password: "123456"
  charset: utf8mb4
  flavor: mysql
  timezone: UTC
  heartbeat_interval_ms: 3000
  read_timeout_ms: 60000
  exclude_schemas: [mysql, sys, information_schema, performance_schema]
  use_gtid: true

node: {}

ha:
  enabled: false
  lease_ttl_seconds: 10
  leader_check_interval_ms: 2000
  resign_on_shutdown: true

pipeline:
  workers: 4
  worker_queue_size: 8192
  batch_size: 500
  flush_interval_ms: 200
  position_save_interval_ms: 3000

targets:
  mysql:
    enabled: true
    addr: 127.0.0.1:13307
    user: root
    password: "123456"
    charset: utf8mb4
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime_min: 30
    tx_chunk_rows: 500
    ddl_sync: true

rules:
  - schema: shop
    sinks: {mysql: true}
    tables:
      - {table: users, do_stock: false}
  - schema: rmqtest
    ddl_policy: auto
    sinks: {mysql: true}
    tables:
      - {table: msg, do_stock: false}

observability:
  metrics_addr: ${METRICS_ADDR}
  web:
    enabled: true
    addr: ${WEB_ADDR}
    username: admin
    password: ${WEB_PASSWORD}
    auth_disabled: false
  log:
    level: info
