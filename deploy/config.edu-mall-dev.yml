# edu.mall dev 环境的 gocdc 配置：7 个源库 118 张表聚合写入 dev_edu.mall.merge。
# 目标库仅预建表结构（启动核对要求目标表存在），数据全部由 gocdc 首启全量快照
# 建立（do_stock=true，PK 游标/分块进度/断点续扫）后接增量——无需 dump 数据、
# 无需手工播种位点（stock 会话自动取 P 先行持久化）。
# 形态：配置存配置中心 etcd /gocdc/edu-mall-dev/config（与协调面同实例）；
#       节点启动 = -cluster edu-mall-dev -etcd <etcd>:2379（纯 flag 形态）。
# 注意：server_id 须与并存运行的 transfer（slave_id=1001）错开，防 dump 连接互踢；
#       dev 环境源/目标口令为测试弱口令（123456），生产务必改 ${ENV} 占位。
cluster: edu-mall-dev

source:
  addr: "mysql-host.com:24971"
  user: root
  password: "123456"
  charset: utf8mb4
  flavor: mysql
  server_id: 110061
  timezone: Asia/Shanghai          # 源 time_zone=+08:00
  use_gtid: true                   # 源库已开 GTID；主从切换免人工修位点
  heartbeat_interval_ms: 3000
  read_timeout_ms: 60000
  exclude_schemas: [mysql, sys, information_schema, performance_schema]

node: { id: "", advertise_addr: "" }
ha:
  enabled: false                    # 单节点：跳过选举，直接以 leader 启动（位点仍走 etcd）
  lease_ttl_seconds: 10
  leader_check_interval_ms: 2000
  resign_on_shutdown: true

pipeline:
  workers: 4                        # 118 表并行快照/回放取 4
  worker_queue_size: 8192
  batch_size: 200
  flush_interval_ms: 200
  position_save_interval_ms: 3000

# 全量快照：源库 root 已有 RELOAD（实测 SHOW GRANTS）→ auto 走 FTWRL
# （毫秒级持有，快照与位点 P 严格对齐），无需降级 none。
stock:
  lock_mode: auto
  workers: 4
  chunk_rows: 5000

targets:
  mysql:
    enabled: true
    addr: "mysql:3306"              # compose 内目标 MySQL（112.61 本机）
    user: root
    password: "123456"
    charset: utf8mb4
    max_open_conns: 20              # 118 表快照需要较高并发连接
    max_idle_conns: 5
    conn_max_lifetime_min: 30
    tx_chunk_rows: 500
    target_database: dev_edu.mall.merge   # 7 源库 118 表全部聚合写入此库
    ddl_sync: true

# 规则表：组形态（组 = schema + sinks + ddl_policy；tables 白名单，未列入的表不同步）。
# do_stock=true 表示该表数据由 gocdc 全量快照自行建立（118 表全 true）；
# 特例排序列/主键照迁。
